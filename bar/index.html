<!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Sample Bar & Lounge – Payeconnect Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel=stylesheet><style>
:root{--n:#0b1d42;--n2:#132b5e;--g:#c9a227;--g2:#f3e6b8;--bg:#f4f6fb;--t:#1a2440;--m:#6b7590}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--t)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--n),var(--n2))}
.lbox{background:#fff;border-radius:14px;padding:30px;width:min(380px,92vw);box-shadow:0 20px 50px #0005;border-top:5px solid var(--g)}
.lbox h1{margin:0 0 4px;font-size:22px;color:var(--n)}.demo{background:var(--g2);border-left:4px solid var(--g);padding:10px;border-radius:6px;font-size:14px;margin:14px 0}
input,select,textarea{width:100%;padding:10px;border:1px solid #d5dbe8;border-radius:8px;margin:5px 0 10px;font:inherit}
.btn{background:var(--n);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:600 14px Inter,system-ui}.btn.g{background:var(--g);color:var(--n)}.btn.o{background:#fff;color:var(--n);border:1px solid #cfd6e6}
#app{display:none;min-height:100vh}aside{position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--n);color:#cdd6ee;padding:18px 0;overflow:auto;z-index:20;transition:.2s}
aside .brand{color:#fff;font-weight:700;padding:0 18px 16px;border-bottom:1px solid #ffffff1a;margin-bottom:8px}aside .brand small{display:block;color:var(--g);font-weight:600}
aside a{display:block;padding:10px 18px;color:#cdd6ee;text-decoration:none;cursor:pointer;border-left:3px solid transparent}aside a:hover{background:#ffffff0d}aside a.on{background:#ffffff14;color:#fff;border-left-color:var(--g)}
.wrap{margin-left:230px}.top{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;box-shadow:0 1px 4px #0001;position:sticky;top:0;z-index:10}
#mb{display:none}.badge{background:var(--g2);color:#7a5c00;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:600}
main{padding:20px;max-width:1150px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0b1d420f;margin-bottom:14px}.kpi{display:flex;gap:12px;align-items:center}.ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}.kpi div{min-width:0}.pipe{display:flex;gap:4px;margin-bottom:14px}.pipe div{flex:1;color:#fff;padding:10px 14px 10px 28px;font-weight:600;font-size:13px;clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,8% 50%)}.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.att .card{display:flex;gap:10px;align-items:center;margin:0}.av{width:38px;height:38px;border-radius:50%;background:var(--n2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}.lst div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf0f6}.kpi b{font-size:24px;color:var(--n);display:block}.kpi span{color:var(--m);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}h2{margin:0 0 14px;color:var(--n)}h3{margin:0 0 10px;font-size:15px;color:var(--n)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar input{width:auto;flex:1;min-width:150px;margin:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{background:#eef1f8;color:var(--n);text-align:left;padding:10px;white-space:nowrap}td{padding:10px;border-bottom:1px solid #edf0f6}tr:hover td{background:#fafbfe}
.pill{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:#e7f6ec;color:#17733a}.pill.w{background:#fff1d6;color:#8a5a00}.pill.r{background:#fde5e5;color:#a12020}
.pb{background:#eef1f8;border-radius:10px;height:10px;min-width:90px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#e2c35a);border-radius:10px}
.alert{background:#fde5e5;color:#8d1c1c;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}
#modal{display:none;position:fixed;inset:0;background:#0b1d4299;z-index:50;align-items:center;justify-content:center}#modal .card{width:min(460px,94vw);max-height:90vh;overflow:auto}
.pos{display:grid;grid-template-columns:2fr 1fr;gap:14px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.items button{padding:16px 8px;border-radius:10px;border:1px solid #d5dbe8;background:#fff;cursor:pointer;font:600 14px Inter}.items button:hover{border-color:var(--g);background:#fffbea}
footer{text-align:center;padding:16px;background:var(--n);margin-top:20px}footer a{color:var(--g);font-weight:600;text-decoration:none}.note{color:var(--m);font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:#f4f6fb;min-height:56px;border-radius:6px;padding:4px;font-size:11px}.cal .ev{background:var(--g2);border:1px solid var(--g)}
@media(max-width:820px){aside{left:-240px}aside.open{left:0}.wrap{margin-left:0}#mb{display:inline-block}.two,.pos{grid-template-columns:1fr}}
@media print{aside,.top,.bar,footer,.noprint{display:none!important}.wrap{margin:0}}
</style></head><body>
<div id=login><div class=lbox><h1>Sample Bar & Lounge</h1><div class=note>Management System · Payeconnect demo</div>
<div class=demo>Demo username: <b>bar</b><br>Demo password: <b>bar2026</b><br><small>Sample login · all data is fictional sample data</small></div>
<input id=u placeholder=Username value=""><input id=p type=password placeholder=Password><button class="btn g" style="width:100%" onclick=go()>Sign in</button><p id=e style="color:#a12020"></p>
<p class=note style="text-align:center"><a href="https://wa.me/231888916127" style="color:var(--n)">Book a free demo on WhatsApp +231 888 916 127</a></p></div></div>
<div id=app><aside id=sb><div class=brand>Sample Bar & Lounge<small>Payeconnect Demo</small></div><div id=nav></div></aside>
<div class=wrap><div class=top><div><button id=mb class="btn o" onclick="sb.classList.toggle('open')">☰</button> <b id=pt></b></div><div><span class=badge>Sample data</span> <button class="btn o" onclick="localStorage.removeItem(K);location.reload()">Sign out / reset</button></div></div>
<main id=m></main><footer><a href="https://wa.me/231888916127">Book a free demo on WhatsApp +231 888 916 127</a></footer></div></div>
<div id=modal onclick="if(event.target==this)cm()"><div class=card id=mc></div></div>
<script>
const C={"title": "Sample Bar & Lounge", "u": "bar", "p": "bar2026", "kpis": [["Sales today", "42,300 LRD", "sample", "\ud83d\udcb5"], ["Net today", "31,300 LRD", "after expenses", "\ud83d\udcc8"], ["Items low", "2", "reorder", "\ud83d\udce6"], ["Staff on duty", "4", "evening shift", "\ud83d\udc64"]], "att": [["Ann (sample)", "Waitress", "Present"], ["Joe (sample)", "Barman", "Present"], ["Sam Demo", "Cook", "Absent"], ["Kate Test", "Cashier", "Present"]], "charts": [["Daily sales \u2013 this week (LRD, sample)", ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], [22000, 25000, 24000, 31000, 46000, 58000, 42300]], ["Weekly earnings (LRD, sample)", ["W40", "W41", "W42", "W43", "W44"], [190000, 205000, 214000, 226000, 248300]], ["Sales by category \u2013 today (sample)", ["Beer", "Soft drinks", "Food", "Spirits"], [18400, 4200, 14500, 5200], 1], ["Sales by staff \u2013 today (sample)", ["Ann", "Joe", "Kate"], [21000, 9800, 11500], 1]], "pos": [["Club Beer", 300], ["Heineken", 400], ["Soft drink", 150], ["Water", 100], ["Grilled fish", 1200], ["Chicken & fries", 1000], ["Malta", 200], ["Juice", 250]], "key": "bar", "mods": {"Sales": {"cols": ["Time", "Item", "Qty", "Total (LRD)", "Staff"], "rows": [["20:40", "Grilled fish", "2", "2,400", "Ann (sample)"], ["19:25", "Soft drink", "4", "600", "Joe (sample)"], ["18:10", "Club Beer", "6", "1,800", "Ann (sample)"]]}, "Stock": {"cols": ["Item", "In stock", "Reorder at", "Status"], "rows": [["Club Beer", "48", "24", "OK"], ["Soft drink", "12", "20", "Low"], ["Malta", "8", "15", "Low"], ["Water", "60", "30", "OK"]], "alert": 1}, "Staff Shifts": {"cols": ["Name", "Role", "Shift", "Hours", "Status"], "rows": [["Ann (sample)", "Waitress", "Evening", "16:00\u201300:00", "On duty"], ["Joe (sample)", "Barman", "Evening", "16:00\u201300:00", "On duty"], ["Sam Demo", "Cook", "Day", "08:00\u201316:00", "Off"]]}, "Expenses": {"cols": ["Date", "Item", "Amount (LRD)", "Paid by"], "rows": [["28 Oct", "Ice & charcoal", "2,500", "Manager"], ["28 Oct", "Generator fuel", "6,000", "Manager"], ["28 Oct", "Cleaning", "2,500", "Manager"]]}, "End-of-Day Report": {"cols": ["Date", "Sales", "Expenses", "Net", "Top item", "Closed by"], "rows": [["28 Oct", "42,300", "11,000", "31,300", "Club Beer", "Manager (sample)"], ["27 Oct", "38,000", "9,500", "28,500", "Grilled fish", "Manager (sample)"]], "act": "Report"}}},K="pc-"+C.key;let S=JSON.parse(localStorage.getItem(K)||"null")||JSON.parse(JSON.stringify(C.mods)),cart=[];
const sv=()=>localStorage.setItem(K,JSON.stringify(S)),$=id=>document.getElementById(id);
function go(){if(u.value=="bar"&&p.value=="bar2026"){sessionStorage.in=1;start()}else e.textContent="Please use the demo login shown above."}
function start(){login.style.display="none";app.style.display="block";show("Dashboard")}if(sessionStorage.in)start();
function svgBar(t,l,v){const mx=Math.max(...v),w=100/v.length;return`<h3>${t}</h3><svg viewBox="0 0 300 150" width=100%>${v.map((x,i)=>{const h=x/mx*110;return`<rect x="${i*300/v.length+6}" y="${125-h}" width="${300/v.length-12}" height="${h}" rx=4 fill="${i==v.length-1?'#c9a227':'#132b5e'}"/><text x="${i*300/v.length+300/v.length/2}" y=142 font-size=9 text-anchor=middle fill="#6b7590">${l[i]}</text><text x="${i*300/v.length+300/v.length/2}" y="${120-h}" font-size=8 text-anchor=middle fill="#1a2440">${x.toLocaleString()}</text>`}).join("")}</svg>`}
function donut(t,l,v){const s=v.reduce((a,b)=>a+b),cl=["#132b5e","#c9a227","#2c8a57","#2c5aa0","#a12020","#7a8bb0"];let a=0,o="";v.forEach((x,i)=>{const f=x/s*251.3;o+=`<circle r=40 cx=60 cy=60 fill=none stroke="${cl[i]}" stroke-width=18 stroke-dasharray="${f} 251.3" stroke-dashoffset="${-a}" transform="rotate(-90 60 60)"/>`;a+=f});return`<h3>${t}</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 120 120" width=150>${o}<text x=60 y=65 text-anchor=middle font-size=16 font-weight=700 fill="#0b1d42">${s.toLocaleString()}</text></svg><div>${l.map((x,i)=>`<div class=note><span style="color:${cl[i]}">■</span> ${x}: <b>${v[i].toLocaleString()}</b></div>`).join("")}</div></div>`}
function pill(c){c=String(c);const r=/low|expired|overdue|pending|absent|critical|unpaid/i,w=/new|soon|follow|partial|scheduled|admitted/i;return r.test(c)?`<span class="pill r">${c}</span>`:w.test(c)?`<span class="pill w">${c}</span>`:/^(active|ok|paid|done|present|normal|treated|in stock|confirmed|on duty|completed)$/i.test(c)?`<span class=pill>${c}</span>`:c}
function nav(n){$("nav").innerHTML=["Dashboard",...Object.keys(S),...(C.pos?[C.posName||"Point of Sale"]:[]),...(C.sms?["SMS Announcements"]:[]),...(C.cal?["Events Calendar"]:[]),...(C.att?["Staff Attendance"]:[])].map(k=>`<a class="${k==n?'on':''}" onclick="show('${k}')">${k}</a>`).join("")}
function show(n){nav(n);pt.textContent=n;sb.classList.remove("open");let h="";
if(n=="Dashboard"){h=`<h2>Dashboard</h2><div class=kpis>${C.kpis.map((k,i)=>`<div class="card kpi"><span class=ic style="background:${["#e8edf8","#fbf3dc","#e6f6ec","#fde8e8"][i%4]};color:${["#132b5e","#9a7400","#17733a","#a12020"][i%4]}">${k[3]||"●"}</span><div><span>${k[0]}</span><b>${k[1]}</b><span>${k[2]||""}</span></div></div>`).join("")}</div>${C.pipe?`<div class=pipe>${C.pipe.map((x,i)=>`<div style="background:${["#132b5e","#2c5aa0","#c9a227","#17733a"][i]}">${x}</div>`).join("")}</div>`:""}${alerts()}<div class=two>${C.charts.map(c=>`<div class=card>${c[3]?donut(...c):svgBar(...c)}</div>`).join("")}</div>`+(C.dash||"")}
else if(n==(C.posName||"Point of Sale"))h=posV();else if(n=="Staff Attendance")h=attV();else if(n=="SMS Announcements")h=smsV();else if(n=="Events Calendar")h=calV();
else{const M=S[n];h=`<h2>${n}</h2>${M.info?`<p class=note>${M.info}</p>`:""}<div class=card><div class=bar><input placeholder="Search ${n.toLowerCase()}…" oninput="flt(this.value)"><button class="btn g" onclick="add('${n}')">+ Add</button><button class="btn o" onclick="csv('${n}')">Export CSV</button><button class="btn o" onclick="print()">Print</button></div><div class=tw><table id=tb><tr>${M.cols.map(c=>`<th>${c}</th>`).join("")}${M.prog?"<th>Progress</th>":""}${M.act?"<th class=noprint></th>":""}</tr>${M.rows.map((r,i)=>`<tr>${r.map(c=>`<td>${pill(c)}</td>`).join("")}${M.prog?`<td><div class=pb><i style="width:${Math.min(100,num(r[M.prog[0]])/num(r[M.prog[1]])*100)}%"></i></div></td>`:""}${M.act?`<td class=noprint><button class="btn o" onclick="det('${n}',${i})">${M.act}</button></td>`:""}</tr>`).join("")}</table></div></div>`}
m.innerHTML=h}
const num=s=>+String(s).replace(/[^0-9.]/g,"")||0;
function alerts(){let a=[];for(const n in S){const M=S[n];if(M.alert)M.rows.forEach(r=>{if(/low|expired|overdue|critical|soon/i.test(r.join(" ")))a.push(`⚠ ${n}: ${r[0]} – ${r.find(c=>/low|expired|overdue|critical|soon/i.test(c))}`)})}return a.length?`<div class=card><h3>Alerts</h3>${a.map(x=>`<div class=alert>${x}</div>`).join("")}</div>`:""}
function flt(q){q=q.toLowerCase();[...tb.rows].slice(1).forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none")}
function csv(n){const M=S[n],t=[M.cols,...M.rows].map(r=>r.map(c=>`"${c}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t]));a.download=n+".csv";a.click()}
function om(h){mc.innerHTML=h;modal.style.display="flex"}function cm(){modal.style.display="none"}
function add(n){const M=S[n];om(`<h3>Add – ${n}</h3>${M.cols.map((c,i)=>`<label class=note>${c}</label><input id=f${i}>`).join("")}<div class=bar><button class="btn g" onclick="sa('${n}')">Save</button><button class="btn o" onclick=cm()>Cancel</button></div><p class=note>Saved in this browser only (demo).</p>`)}
function sa(n){const M=S[n];M.rows.unshift(M.cols.map((c,i)=>$("f"+i).value||"—"));sv();cm();show(n)}
function det(n,i){const M=S[n],r=M.rows[i];om(`<div id=rc><h3>${M.act} – ${r[0]}</h3><p class=note>${C.title} · Sample document</p><table>${M.cols.map((c,j)=>`<tr><th>${c}</th><td>${r[j]}</td></tr>`).join("")}</table>${M.hist?`<h3 style="margin-top:12px">History</h3>${M.hist.map(x=>`<div class=note>• ${x}</div>`).join("")}`:""}</div><div class=bar style="margin-top:12px"><button class="btn g" onclick="print()">Print</button><button class="btn o" onclick=cm()>Close</button></div>`)}
function posV(){return`<h2>Point of Sale</h2><div class=pos><div class=card><h3>Tap items to add</h3><div class=items>${C.pos.map((x,i)=>`<button onclick="ca(${i})">${x[0]}<br><small class=note>${x[1]} LRD</small></button>`).join("")}</div></div><div class=card><h3>Current order</h3><div id=ct></div><button class="btn g" style="width:100%;margin-top:10px" onclick=pay()>Complete sale</button><p class=note>Sample prices in LRD for the demo bar only.</p></div></div>`}
function ca(i){cart.push(C.pos[i]);rc()}function rc(){ct.innerHTML=cart.map(x=>`<div class=bar style="justify-content:space-between"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")+`<hr><b>Total: ${cart.reduce((a,x)=>a+x[1],0).toLocaleString()} LRD</b>`}
function pay(){if(!cart.length)return;const s=S[C.posTo||"Sales"];cart.forEach(x=>s.rows.unshift(C.posTo?["Walk-in (sample)",x[0],x[1].toLocaleString(),"Paid"]:[new Date().toTimeString().slice(0,5),x[0],"1",x[1].toLocaleString(),"Demo staff"]));sv();const t=cart.reduce((a,x)=>a+x[1],0);cart=[];om(`<h3>Sale complete ✓</h3><p>Receipt total: <b>${t.toLocaleString()} LRD</b></p><p class=note>Added to Sales and today's report (sample).</p><button class="btn g" onclick="cm();show(C.posName||'Point of Sale')">New sale</button>`)}
function attV(){return`<h2>Staff Attendance – today (sample)</h2><div class=att>${C.att.map((x,i)=>`<div class=card><span class=av>${x[0][0]}</span><div><b>${x[0]}</b><br><span class=note>${x[1]}</span><br><a style="cursor:pointer" onclick="C.att[${i}][2]=C.att[${i}][2]=='Present'?'Absent':'Present';show('Staff Attendance')">${pill(x[2])}</a></div></div>`).join("")}</div><p class=note>Tap a status to mark Present/Absent.</p>`}
function smsV(){return`<h2>SMS Announcements</h2><div class=card><label class=note>Send to</label><select id=sg><option>All members</option><option>Choir</option><option>Youth</option><option>Pledgers with balance</option></select><label class=note>Message</label><textarea id=sm rows=4>Reminder: Thanksgiving service this Sunday at 9am. God bless you!</textarea><button class="btn g" onclick="om('<h3>Mock send ✓</h3><p>Announcement queued to <b>'+sg.value+'</b> (demo only, no SMS is actually sent).</p><button class=&quot;btn g&quot; onclick=cm()>OK</button>')">Send announcement</button></div><div class=card><h3>Recent announcements (sample)</h3><div class=note>• 22 Oct – All members: Building fund meeting after service</div><div class=note>• 15 Oct – Youth: Youth fellowship Friday 5pm</div></div>`}
function calV(){const ev=C.cal;let d="";for(let i=1;i<=31;i++){const e=ev.find(x=>x[0]==i);d+=`<div class="${e?'ev':''}"><b>${i}</b>${e?"<br>"+e[1]:""}</div>`}return`<h2>Events Calendar – November 2026 (sample)</h2><div class=card><div class=cal>${"SunMonTueWedThuFriSat".match(/.../g).map(x=>`<b class=note>${x}</b>`).join("")}${d}</div></div><div class=card><h3>Upcoming</h3>${ev.map(x=>`<div class=note>• Nov ${x[0]} – ${x[1]}</div>`).join("")}</div>`}
</script></body></html>
